<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!--
  MODÈLE BRIXEL — niche : Casse-croûte, pizzeria et crèmerie — v1
  REPÈRES À REMPLIR (rien d'autre à toucher pour un site normal) :
   1. Les repères TITRE et DESCRIPTION (entre doubles accolades) ci-dessous (titre de l'onglet et meta description, vrais mots du commerce).
   2. Le repère NOM (entre doubles accolades) dans le bandeau « Aperçu préparé pour … » (garder ce texte exact; pour langue "en" ou "bilingue", ajouter « · Preview prepared for NOM — not their official website »).
   3. COULEURS : les variables --c-… dans :root (prendre celles du logo / de la devanture).
   4. LE CONTENU : tout est dans le bloc de données JSON (la balise script dont l'id est donnees, plus bas). Mettre "_exemple": false une fois rempli.
  Pour rendre le site unique : "variante":{"hero":"a|b|c"}, "ordre":[…] des sections, "speciale":{…}, "logoSvg", couleurs.
  Ne pas modifier le MOTEUR (dernier <script>) ni les styles communs.
-->
<title>Pizza Saint-Augustin — Pizzeria à Mirabel</title>
<meta name="description" content="Pâte et sauce faites sur place, pizzas bien garnies. Livraison, pour emporter ou sur place : appelez-nous pour commander.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Archivo:wdth,wght@62..125,400..900&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* ===== COULEURS ET POLICES — À CHANGER selon le logo / la devanture du commerce ===== */
:root{--c-fond:#fff8ea;--c-fond2:#ffedc4;--c-texte:#1d1a17;--c-doux:#5e5248;--c-prim:#e0262c;--c-prim-texte:#fff;--c-acc:#ffc629;--c-acc-texte:#1d1a17;--c-acc-sombre:#ffc629;--c-carte:#fff;--c-ligne:#efd9ad;--c-sombre:#15172a;--c-sombre-texte:#fff3dc;--c-nav:rgba(255,248,234,.97);--c-pied:#0d0e1b;--c-turq:#14a394;--c-encre:#1d1a17;--c-neon:#ff2f6d;--f-titre:'Bowlby One',Impact,sans-serif;--f-texte:'Archivo',system-ui,sans-serif;--f-script:'Yellowtail',cursive;--titre-poids:400;--titre-esp:.005em;--em-style:normal;--rayon:16px;--rayon-btn:14px}
/* ===== MOTEUR BRIXEL — styles communs (ne pas modifier : changer seulement les couleurs dans :root plus haut) ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:calc(var(--bh,32px) + 76px);-webkit-text-size-adjust:100%}
body{font-family:var(--f-texte);background:var(--c-fond);color:var(--c-texte);line-height:1.6;font-size:16.5px;padding-top:var(--bh,32px);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
img,svg{max-width:100%}
a{color:inherit}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--f-titre);font-weight:var(--titre-poids,800);line-height:1.08;text-transform:var(--titre-casse,none);letter-spacing:var(--titre-esp,-.01em)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
#apercu{position:fixed;top:0;left:0;right:0;z-index:9999;background:#111;color:#fff;font:13px/1.4 system-ui,sans-serif;text-align:center;padding:6px 10px}
#exemple{position:fixed;left:0;right:0;bottom:0;z-index:9998;background:#d40000;color:#fff;font:700 13px/1.3 system-ui,sans-serif;text-align:center;padding:6px}
/* ---- barre du haut ---- */
.nav{position:fixed;top:var(--bh,32px);left:0;right:0;z-index:60;background:var(--c-nav,var(--c-fond));color:var(--c-nav-texte,var(--c-texte));border-bottom:var(--nav-bord,1px solid var(--c-ligne));transition:box-shadow .3s}
.nav.ombre{box-shadow:0 8px 30px rgba(0,0,0,.12)}
.nav-in{display:flex;align-items:center;gap:10px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1 1 auto}
.brand .lg{width:44px;height:44px;flex:none;display:block}
.brand .lg svg{width:100%;height:100%;display:block}
.brand b{display:block;font-family:var(--f-titre);font-weight:var(--titre-poids,800);font-size:1.12rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:var(--titre-casse,none)}
.brand small{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.brand span{min-width:0;overflow:hidden}
.liens{display:none;gap:22px;align-items:center}
.liens a{text-decoration:none;font-weight:600;font-size:.95rem;opacity:.85}
.liens a:hover{opacity:1;color:var(--c-acc)}
.nav-act{display:flex;align-items:center;gap:6px;flex:none}
.lang{border:1.5px solid currentColor;background:none;color:inherit;font-weight:800;font-size:.78rem;border-radius:8px;padding:7px 9px;cursor:pointer;opacity:.85}
.btn-tel{display:inline-flex;align-items:center;gap:6px;background:var(--c-prim);color:var(--c-prim-texte,#fff);text-decoration:none;font-weight:800;font-size:.9rem;border-radius:var(--rayon-btn,999px);padding:10px 14px;white-space:nowrap}
.btn-tel svg{width:17px;height:17px;flex:none}
.burger{width:42px;height:42px;border:0;background:none;color:inherit;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer}
.burger span{width:22px;height:2.5px;background:currentColor;border-radius:2px;transition:transform .25s,opacity .25s}
.nav.ouvert .burger span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.nav.ouvert .burger span:nth-child(2){opacity:0}
.nav.ouvert .burger span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.mnav{display:none;padding:4px 20px 18px;border-top:1px solid var(--c-ligne)}
.nav.ouvert .mnav{display:block}
.mnav a{display:block;padding:13px 0;text-decoration:none;font-weight:700;border-bottom:1px solid var(--c-ligne)}
@media(max-width:400px){.btn-tel .t{display:none}.btn-tel{padding:10px 12px}.brand b{font-size:1rem}}
@media(min-width:1024px){.liens{display:flex}.burger,.mnav{display:none!important}.nav-act{margin-left:8px}}
/* ---- boutons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:var(--rayon-btn,999px);font-weight:800;text-decoration:none;font-size:1rem;border:2px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s;background:none;color:inherit}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:19px;height:19px;flex:none}
.btn-p{background:var(--c-prim);color:var(--c-prim-texte,#fff);box-shadow:0 10px 26px -10px var(--c-prim)}
.btn-a{background:var(--c-acc);color:var(--c-acc-texte,#111)}
.btn-o{border-color:currentColor}
/* ---- héros (3 styles : a, b, c) ---- */
.hero{position:relative;overflow:hidden;isolation:isolate;padding:104px 0 70px;background:var(--hero-fond,var(--c-fond2));color:var(--hero-texte,var(--c-texte))}
.hero .wrap{position:relative;z-index:2;display:grid;gap:34px;align-items:center}
.surtitre{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;color:var(--hero-acc,var(--c-acc))}
.surtitre:before{content:"";width:24px;height:2px;background:currentColor}
.hero h1{font-size:clamp(2.3rem,9.5vw,4.6rem);margin:14px 0 14px}
.hero h1 em{font-style:var(--em-style,normal);color:var(--hero-acc,var(--c-acc))}
.hero .lead{font-size:1.1rem;max-width:36em;opacity:.9}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.puces{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;list-style:none}
.puces li{font-size:.84rem;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--puce-fond,rgba(127,127,127,.12));border:1px solid var(--puce-bord,rgba(127,127,127,.22))}
.puces li .et{color:#f5b301}
.hero-art{justify-self:center;width:min(440px,86vw)}
.hero-art svg{width:100%;height:auto;display:block}
.hero.v-b{text-align:center;padding-bottom:84px}
.hero.v-b .wrap{justify-items:center}
.hero.v-b .lead{margin:0 auto}
.hero.v-b .cta,.hero.v-b .puces{justify-content:center}
.hero.v-b .hero-art{width:min(260px,60vw);order:-1}
.hero.v-b h1{font-size:clamp(2.5rem,11vw,5.6rem)}
.hero.v-c{padding-bottom:0}
.hero.v-c .hero-art{display:none}
.hero.v-c .bande{margin-top:46px;background:var(--c-prim);color:var(--c-prim-texte,#fff);padding:18px 0;position:relative;z-index:2}
.hero.v-c .bande .wrap{display:flex;flex-wrap:wrap;gap:10px 30px;justify-content:center;font-weight:800;text-align:center}
@media(min-width:960px){.hero{padding:150px 0 110px}.hero:not(.v-b):not(.v-c) .wrap{grid-template-columns:1.1fr .9fr}.hero.v-c{padding-bottom:0}}
.flot{position:absolute;inset:0;z-index:1;pointer-events:none}
.fl{position:absolute;transform:translate3d(0,calc(var(--py,0px)*var(--k,.3)),0)}
.fl>svg{display:block;animation:flotte var(--t,10s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.fl.loin{opacity:.22;filter:blur(1.6px)}
.fl.mi{opacity:.42}
.fl.pres{opacity:.7}
@keyframes flotte{from{transform:translateY(-10px) rotate(var(--r0,-10deg))}to{transform:translateY(14px) rotate(var(--r1,14deg))}}
/* ---- sections ---- */
section.s{padding:76px 0;position:relative}
section.s.alt{background:var(--c-fond2)}
section.s.sombre{background:var(--c-sombre);color:var(--c-sombre-texte,#fff)}
.tete{max-width:720px;margin:0 0 34px}
.tete.c{margin:0 auto 38px;text-align:center}
.tete small{display:block;color:var(--c-acc);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem;margin-bottom:8px}
.sombre .tete small{color:var(--c-acc-sombre,var(--c-acc))}
.tete h2{font-size:clamp(1.9rem,6.4vw,3rem)}
.tete p{margin-top:12px;color:var(--c-doux);font-size:1.05rem}
.sombre .tete p{color:inherit;opacity:.8}
.grille{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.grille.g2,.grille.g3,.grille.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.grille.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grille.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.carte{background:var(--c-carte);border:1px solid var(--c-ligne);border-radius:var(--rayon,18px);padding:22px;min-width:0;color:var(--c-texte)}
.carte h3{font-size:1.2rem;margin-bottom:6px}
.carte p{color:var(--c-doux);font-size:.97rem}
.ico{width:52px;height:52px;border-radius:var(--rayon-ico,14px);background:var(--ico-fond,rgba(127,127,127,.12));display:grid;place-items:center;margin-bottom:14px;color:var(--c-prim)}
.ico svg{width:30px;height:30px}
.grp-titre{font-size:1.35rem;margin:30px 0 14px}
.grp-titre:first-child{margin-top:0}
/* services en liste compacte */
.svc{display:flex;gap:14px;align-items:flex-start}
.svc .ico{margin:0;flex:none}
/* ---- menu ---- */
.onglets{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:none;border:2px solid var(--c-ligne);background:var(--c-carte);color:var(--c-texte);border-radius:999px;padding:9px 16px;font-weight:800;font-size:.9rem;cursor:pointer;white-space:nowrap}
.onglet[aria-selected=true]{background:var(--c-prim);border-color:var(--c-prim);color:var(--c-prim-texte,#fff)}
.sombre .onglet{background:transparent;color:inherit;border-color:rgba(255,255,255,.25)}
.sombre .onglet[aria-selected=true]{background:var(--c-acc);border-color:var(--c-acc);color:var(--c-acc-texte,#111)}
.panneau{display:none}
.panneau.on{display:grid}
.mcat{background:var(--c-carte);color:var(--c-texte);border-radius:var(--rayon,18px);padding:22px 22px 14px;border:1px solid var(--c-ligne);min-width:0}
.mcat h3{font-size:1.35rem;color:var(--c-prim);margin-bottom:2px}
.mcat .mnote{font-size:.86rem;color:var(--c-doux);margin-bottom:8px}
.plat{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed var(--c-ligne)}
.plat:last-child{border-bottom:0}
.plat .n{flex:1 1 auto;min-width:0;font-weight:700}
.plat .n small{display:block;font-weight:400;color:var(--c-doux);font-size:.87rem;margin-top:1px}
.plat .p{white-space:nowrap;font-weight:800;color:var(--c-prim)}
.menu-note{margin-top:20px;font-size:.92rem;opacity:.8;text-align:center}
/* ---- avis ---- */
.score{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 22px;background:var(--c-carte);color:var(--c-texte);border:1px solid var(--c-ligne);border-radius:var(--rayon,18px);padding:20px 26px;max-width:640px;margin:0 auto 30px;text-align:center}
.score .gros{font-family:var(--f-titre);font-weight:900;font-size:3.2rem;line-height:1;color:var(--c-prim)}
.etoiles{color:#f5b301;letter-spacing:2px;font-size:1.15rem}
.etoiles .v{color:#d6d6d6}
.score p{color:var(--c-doux)}
.av{display:flex;flex-direction:column;gap:10px}
.av q{display:block;quotes:"« " " »";font-size:1rem;color:var(--c-texte)}
.av .qui{margin-top:auto;font-size:.88rem;color:var(--c-doux)}
.av .qui b{color:var(--c-texte)}
.centre{text-align:center;margin-top:26px}
body.vp>*:not(#pageAvis):not(#apercu):not(#exemple):not(script){display:none!important}
#pageAvis{display:none;min-height:100vh}
body.vp #pageAvis{display:block}
#pageAvis .pa-tete{position:sticky;top:var(--bh,32px);z-index:5;background:var(--c-sombre);color:var(--c-sombre-texte,#fff)}
#pageAvis .pa-tete .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px}
#pageAvis .pa-tete .btn{min-height:42px;padding:0 16px;border-color:currentColor}
#pageAvis .pa-tete b{white-space:nowrap;font-size:.95rem}
#pageAvis .corps{padding:30px 0 80px}
#pageAvis h1{font-size:clamp(1.9rem,6vw,2.8rem);margin-bottom:6px}
/* ---- histoire ---- */
.hist{display:grid;gap:30px;align-items:start}
@media(min-width:900px){.hist{grid-template-columns:1fr 1fr}}
.hist p{margin-bottom:14px;color:var(--c-doux);font-size:1.03rem}
.sombre .hist p{color:inherit;opacity:.85}
.citation{font-family:var(--f-titre);font-size:1.45rem;line-height:1.3;border-left:4px solid var(--c-acc);padding-left:16px;margin:18px 0}
.ligne-t{list-style:none;border-left:3px solid var(--c-acc);margin-left:8px}
.ligne-t li{position:relative;padding:0 0 20px 24px}
.ligne-t li:before{content:"";position:absolute;left:-10px;top:5px;width:17px;height:17px;border-radius:50%;background:var(--c-prim);border:3px solid var(--c-fond)}
.ligne-t b{display:block;font-family:var(--f-titre);font-size:1.35rem;color:var(--c-prim)}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.chiffres div{background:var(--c-carte);border:1px solid var(--c-ligne);border-radius:var(--rayon,18px);padding:16px 12px;text-align:center;min-width:0;color:var(--c-texte)}
.chiffres b{display:block;font-family:var(--f-titre);font-weight:900;font-size:2rem;line-height:1.05;color:var(--c-prim)}
.chiffres span{font-size:.86rem;color:var(--c-doux)}
/* ---- zones / faq ---- */
.zones{display:flex;flex-wrap:wrap;gap:8px}
.zones span{padding:7px 14px;border-radius:999px;background:var(--c-carte);border:1px solid var(--c-ligne);font-weight:600;font-size:.9rem;color:var(--c-texte)}
.faq details{background:var(--c-carte);border:1px solid var(--c-ligne);border-radius:14px;padding:16px 18px;margin-bottom:10px;color:var(--c-texte)}
.faq summary{font-weight:800;cursor:pointer}
.faq details p{margin-top:8px;color:var(--c-doux)}
/* ---- contact ---- */
.heures{width:100%;border-collapse:collapse}
.heures td{padding:8px 0;border-bottom:1px dashed var(--c-ligne);vertical-align:top}
.heures td+td{text-align:right;font-weight:800;padding-left:10px}
.heures tr.auj td{color:var(--c-prim)}
.ct a{font-weight:800;color:var(--c-prim);overflow-wrap:anywhere}
.ct p{margin-bottom:8px}
.gros-tel{display:block;font-family:var(--f-titre);font-size:1.7rem;font-weight:900;text-decoration:none;color:var(--c-prim)}
.appel-final{text-align:center}
.appel-final h2{font-size:clamp(2rem,7vw,3.4rem)}
.appel-final p{opacity:.85;max-width:36em;margin:12px auto 24px}
.appel-final .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
footer.pied{background:var(--c-pied,#111);color:rgba(255,255,255,.72);text-align:center;font-size:.88rem;padding:32px 20px 104px}
footer.pied b{color:#fff;font-family:var(--f-titre);font-size:1.15rem;display:block;margin-bottom:4px}
footer.pied a{color:#fff}
.callbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:55;display:flex;gap:8px}
.callbar a{flex:1;min-height:54px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.callbar a.sec{flex:0 0 auto;background:var(--c-carte);color:var(--c-texte);padding:0 18px}
@media(min-width:1024px){.callbar{display:none}footer.pied{padding-bottom:32px}}
/* ---- apparition ---- */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
/* ---- intro ---- */
#intro{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;background:var(--intro-fond,var(--c-sombre));color:var(--intro-texte,#fff);cursor:pointer;transition:opacity .5s;overflow:hidden}
#intro.part{opacity:0}
#intro .ib{text-align:center;padding:20px;position:relative;z-index:2}
#intro .ilg{width:96px;height:96px;margin:0 auto 14px;transform:scale(0) rotate(-30deg);animation:ipop .7s .1s cubic-bezier(.3,1.6,.5,1) forwards}
#intro .ilg svg{width:100%;height:100%}
#intro .imot{font-family:var(--f-titre);font-weight:900;font-size:clamp(2rem,9vw,4rem);line-height:1.05;text-transform:var(--titre-casse,none)}
#intro .imot span{display:inline-block;opacity:0;transform:translateY(-50px) rotate(-8deg);animation:ichute .5s cubic-bezier(.3,1.6,.5,1) forwards}
#intro .isous{margin-top:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:.76rem;color:var(--c-acc);opacity:0;animation:ifade .5s 1.1s forwards}
@keyframes ipop{to{transform:none}}
@keyframes ichute{to{opacity:1;transform:none}}
@keyframes ifade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}#intro{display:none}.fl{transform:none!important}}
@media(min-width:900px){.panneau .mcat{column-count:2;column-gap:44px}.panneau .mcat h3,.panneau .mcat .mnote{column-span:all}.panneau .plat{break-inside:avoid}}
html[lang^=en] .av q{quotes:"\201C" "\201D"}
@media(min-width:900px){.onglets{flex-wrap:wrap;overflow:visible;justify-content:center}}
/* ---- produits (exemples « Votre produit ») ---- */
.pgrille{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.pgrille{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1050px){.pgrille{grid-template-columns:repeat(4,minmax(0,1fr))}}
.prod{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--c-carte);border:1px solid var(--c-ligne);border-radius:var(--rayon,18px);padding:10px 10px 14px;cursor:pointer;color:var(--c-texte);font:inherit;min-width:0;transition:transform .2s,box-shadow .2s}
.prod:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.4)}
.prod[hidden]{display:none}
.pgrille:not(.tout) .prod.plus{display:none}
#pgrille+.centre{margin-top:22px}
.pimg{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:calc(var(--rayon,18px)*.7);background:repeating-linear-gradient(45deg,rgba(127,127,127,.07) 0 12px,rgba(127,127,127,.13) 12px 24px);color:var(--c-acc);overflow:hidden;margin-bottom:6px}
.pimg svg{width:42%;height:42%;opacity:.55}

.hero h1{font-size:clamp(2.5rem,11.5vw,5.1rem);line-height:.98;letter-spacing:.005em}
.hero h1 em{font-family:var(--f-script);text-transform:none;font-weight:400;display:inline-block;font-size:1.32em;transform:rotate(-5deg);line-height:.75;padding:0 .08em;text-shadow:3px 3px 0 var(--c-acc)}
.hero .lead{font-size:1.12rem}
.cc-art{overflow:visible}
.cc-soleil{transform-origin:118px 118px;animation:ccPulse 6s ease-in-out infinite}

.cc-cornet{transform-origin:325px 214px;animation:ccBalance 4s ease-in-out infinite}

.cc-bulbes circle{animation:ccBulbe 1.2s steps(1) infinite}
.cc-bulbes circle:nth-child(odd){animation-delay:.6s}

.cc-ouvert{animation:ccFlick 5s linear infinite;filter:drop-shadow(0 0 4px #ff2f6d)}

/* ---- moment wow : l'enseigne au néon s'allume ---- */
.cc-nuit{background:radial-gradient(ellipse at 30% 40%,rgba(255,47,109,.16),transparent 60%),linear-gradient(180deg,#15172a,#1d1630);color:#fff;overflow:hidden;padding:84px 0}

.cc-neon{display:grid;place-items:center}

.cc-tube{width:110px;height:auto;display:block;margin:0 auto 4px;overflow:visible}
.cc-tube path{fill:none;stroke:#3a3550;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.cc-mot{font-family:var(--f-script);font-size:clamp(3.4rem,15vw,5.4rem);line-height:1;color:#4a3346;white-space:nowrap}

 var H=(D.heures||[]).map(function(h){var auj=h.idx!=null&&(Array.isArray(h.idx)?h.idx.indexOf(jourIdx())>=0:h.idx===jourIdx());return '<tr'+(auj?' class="auj"':'')+'><td>'+esc(t(h.jours))+'</td><td>'+esc(t(h.heures))+'</td></tr>'}).join('');

 var R=D.reseaux||{},rs=Object.keys(R).filter(function(k){return R[k]}).map(function(k){return '<a href="'+esc(R[k])+'" target="_blank" rel="noopener">'+esc(k.charAt(0).toUpperCase()+k.slice(1))+'</a>'}).join(' · ');
 var C=D.contact||{};

 (A.rue||A.ville?'<div class="carte ct rv"><h3>'+esc(u('adresse'))+'</h3><p>'+esc(A.rue||'')+(A.rue?'<br>':'')+esc([A.ville,A.province?'('+A.province+')':''].filter(Boolean).join(' '))+(A.codePostal?' '+esc(A.codePostal):'')+'</p><p><a href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(q)+'" target="_blank" rel="noopener">'+esc(u('itin'))+' →</a></p>'+(t(A.note)?'<p style="font-size:.88rem;color:var(--c-doux)">'+esc(t(A.note))+'</p>':'')+'</div>':'')+
 '<div class="carte ct rv"><h3>'+esc(u('tel'))+'</h3><a class="gros-tel" href="'+telHref()+'">'+esc(D.telephone||'')+'</a>'+tels+(D.courriel?'<p>'+esc(u('courriel'))+' : <a href="mailto:'+esc(D.courriel)+'">'+esc(D.courriel)+'</a></p>':'')+(rs?'<p>'+esc(u('suivez'))+' : '+rs+'</p>':'')+'</div>'+

 '<section class="s sombre appel-final"><div class="wrap rv"><h2>'+emph(t(C.finalTitre)||u('appelFinal'))+'</h2>'+(t(C.finalTexte)?'<p>'+esc(t(C.finalTexte))+'</p>':'<p></p>')+'<div class="cta"><a class="btn btn-a" href="'+telHref()+'">'+ICO_TEL+esc(D.telephone||'')+'</a></div></div></section>'}

 '<div class="grille g3">'+L.slice(0,L.length>=9?9:(L.length>=6?6:3)).map(carteAvis).join('').replace(/ rv"/g,'"')+'</div>'+(A.lienGoogle?'<p class="centre"><a class="btn btn-p" href="'+esc(A.lienGoogle)+'" target="_blank" rel="noopener">'+esc(u('lireGoogle'))+(A.nombre?' ('+esc(A.nombre)+')':'')+'</a></p>':'')+'</div></div>';

function brancher(){

bh();addEventListener('resize',bh,{passive:true});

addEventListener('scroll',function(){if(tk)return;tk=true;requestAnimationFrame(function(){tk=false;var y=scrollY;$('nav').classList.toggle('ombre',y>10);if(!red&&y<1200){var f=$('flot');if(f)f.style.setProperty('--py',(-y)+'px')}if(SK.defile)SK.defile(y)})},{passive:true});
})();
